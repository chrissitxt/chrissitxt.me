<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chrissi's thoughts</title>
    <link rel="icon" type="image/png" href="../assets/oshawott.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="page">
    <a href="../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>home</span>
    </a>

    <div class="page-title">chrissi's thoughts</div>
    <div class="page-subtitle">random yapping, whatever's on my mind at the time.</div>

    <div class="search-container">
        <input class="search-bar glass" placeholder="search posts..." id="searchInput">
    </div>

    <div class="list-container" id="postsContainer">
        <div class="no-results" id="noResults">
            <p class="no-results-text">no posts found matching your search</p>
        </div>

        <div class="card glass glass-interactive" data-search="hello about me coding journey philosophy mods fabric modrinth reading writing book jenseits der realitaet vct football">
            <a href="0001.html" class="card-header">
                <div class="card-header-content">
                    <h3 class="card-title">hey, i'm chrissi</h3>
                    <div class="card-link">
                        <span>August 4, 2026</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const postCards = document.querySelectorAll('#postsContainer .card');
    const noResults = document.getElementById('noResults');

    searchInput.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase().trim();
        let visibleCount = 0;

        postCards.forEach(card => {
            const searchData = card.dataset.search || '';
            const matches = searchData.includes(searchTerm);
            card.style.display = matches ? 'block' : 'none';
            if (matches) visibleCount++;
        });

        noResults.classList.toggle('show', visibleCount === 0 && searchTerm !== '');
    });
</script>
</body>
</html>
